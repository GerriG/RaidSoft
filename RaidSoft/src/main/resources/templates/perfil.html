<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mi Perfil - RaidSoft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Perfil.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">
                <i class="fas fa-cubes me-2"></i> RaidSoft
            </a>
            <div class="ms-auto">
                <a th:href="${usuario.rol.name() == 'ADMINISTRADOR' ? '/admin/dashboard' : '/vendedor/dashboard'}" 
                   class="btn btn-outline-secondary rounded-pill">
                    <i class="fas fa-arrow-left me-2"></i> Volver al Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="profile-glass-card animate__animated animate__fadeInUp">
                    
                    <a th:href="@{/perfil/editar}" class="btn-edit-floating" title="Editar Perfil">
                        <i class="fas fa-pen"></i>
                    </a>

                    <div class="profile-header">
                        <div class="avatar-container">
                            <img th:if="${usuario.imagenUrl == null}" 
                                 src="https://ui-avatars.com/api/?background=4e73df&color=fff&name=User" 
                                 class="avatar-img" alt="Avatar Default">
                                 
                            <img th:if="${usuario.imagenUrl != null}" 
                                 th:src="@{${usuario.imagenUrl}}" 
                                 class="avatar-img" alt="Avatar Usuario">
                        </div>
                        <h2 class="user-name" th:text="${usuario.nombre + ' ' + usuario.apellido}">Nombre Apellido</h2>
                        <span class="role-badge">
                            <i class="fas fa-shield-alt me-1"></i> <span th:text="${usuario.rol}">ROL</span>
                        </span>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="info-group">
                                <span class="label-text"><i class="fas fa-user me-2"></i>Usuario</span>
                                <div class="value-text" th:text="${usuario.username}">username</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-group">
                                <span class="label-text"><i class="fas fa-calendar me-2"></i>Miembro Desde</span>
                                <div class="value-text" th:text="${#temporals.format(usuario.createdAt, 'dd/MM/yyyy')}">01/01/2025</div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="info-group">
                                <span class="label-text"><i class="fas fa-check-circle me-2"></i>Estado de Cuenta</span>
                                <div class="value-text text-success">
                                    <i class="fas fa-circle me-1" style="font-size: 0.7rem;"></i> Activo
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var msgSuccess = /*[[${success}]]*/ null;
        if (msgSuccess) {
            Swal.fire({
                icon: 'success',
                title: '¡Excelente!',
                text: msgSuccess,
                confirmButtonColor: '#4e73df'
            });
        }
        /*]]>*/
    </script>

</body>
</html>
