<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion} + ' Producto - RaidSoft'"></title>

    <link rel="stylesheet" th:href="@{/css/Admin.css}">
    <link rel="stylesheet" th:href="@{/css/form_producto.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>
    <div class="admin-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3>RaidSoft Admin</h3>
            </div>
            <ul class="sidebar-menu">
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="#"><i class="fas fa-users"></i> Usuarios</a></li>
                <li><a th:href="@{/admin/productos}" class="active"><i class="fas fa-box"></i> Productos</a></li>
                <li><a href="#"><i class="fas fa-clipboard-list"></i> Stock</a></li>
                <li>
                    <a href="#" onclick="Swal.fire('En desarrollo', 'El módulo de reportes estará disponible pronto.', 'info'); return false;">
                        <i class="fas fa-chart-line"></i> Reportes
                    </a>
                </li>
                <li><a th:href="@{/perfil}"><i class="fas fa-user-circle"></i> Mi Perfil</a></li>
                <li class="logout-item">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
                    </form>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header>
                <div class="user-welcome">
                    <h1 th:text="${accion} + ' Producto'">Formulario Producto</h1>
                    <p class="text-muted">Ingresa o modifica la información del producto</p>
                </div>
            </header>

            <div class="form-container">
                <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data">

                    <input type="hidden" th:field="*{idProducto}" />
                    <input type="hidden" th:field="*{estado}" /> 

                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required/>
                    </div>

                    <div class="form-group">
                        <label for="codigoBarras">Código de Barras:</label>
                        <input type="text" id="codigoBarras" th:field="*{codigoBarras}" class="form-control" />
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" th:field="*{descripcion}" class="form-control"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="precioCompra">Precio de Compra:</label>
                        <input type="number" id="precioCompra" th:field="*{precioCompra}" class="form-control" step="0.01" />
                    </div>

                    <div class="form-group">
                        <label for="precioVenta">Precio de Venta:</label>
                        <input type="number" id="precioVenta" th:field="*{precioVenta}" class="form-control" step="0.01" required/>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock:</label>
                        <input type="number" id="stock" th:field="*{stock}" class="form-control" required/>
                    </div>

                    <div class="form-group">
                        <label for="stockMinimo">Stock Mínimo:</label>
                        <input type="number" id="stockMinimo" th:field="*{stockMinimo}" class="form-control" />
                    </div>

                    <div class="form-group">
                        <label>Imagen del Producto:</label>
                        
                        <input type="file" name="file" class="form-control" accept="image/*">
                        
                        <div th:if="${producto.imagenUrl != null}" style="margin-top: 10px;">
                            <p>Imagen actual:</p>
                            <img th:src="@{${producto.imagenUrl}}" width="100" style="border: 1px solid #00ffff; border-radius: 5px;">
                        </div>
                        
                        <input type="hidden" th:field="*{imagenUrl}">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-success" th:text="${accion}"></button>
                        <a th:href="@{/admin/productos}" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 

    <script th:if="${success}">
        let message = '[[${success}]]';

        Swal.fire({
            title: "¡Operación Exitosa!",
            text: message,
            icon: "success",
            draggable: true,
            customClass: {
                popup: 'swal-gamer-popup',
                confirmButton: 'swal-gamer-button'
            },
            buttonsStyling: false
        });
    </script>
</body>
</html>
