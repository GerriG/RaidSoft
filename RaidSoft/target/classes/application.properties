spring.application.name=RaidSoft

# ==============================================================
# CONFIGURACIÓN DE BASE DE DATOS
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/raidsoft
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS (NUEVO)
# ==============================================================
# Límite para un solo archivo (15MB)
spring.servlet.multipart.max-file-size=15MB

# Límite para el total de la petición (útil si subes varios archivos a la vez)
spring.servlet.multipart.max-request-size=20MB

# (Opcional) Habilita la carga diferida si es necesario
spring.servlet.multipart.enabled=true