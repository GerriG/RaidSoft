spring.application.name=RaidSoft
# Configuración de Conexión (Extraída de tu clase ConexionBD)
spring.datasource.url=jdbc:mysql://localhost:3306/raidsoft
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraciones recomendadas para que JPA/Hibernate funcione bien con MySQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
