<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso RaidSoft</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    
    <div class="login-page-wrapper">
        
        <div class="login-card">
            
            <div class="header-logo">
                <i class="fas fa-cubes"></i>
                <h1>RaidSoft</h1>
            </div>

            <div class="security-warning">
                <i class="fas fa-exclamation-triangle"></i>
                ACCESO RESTRINGIDO. Solo personal autorizado.
            </div>

            <form id="formLogin" class="login-form">
                
                <h2 class="title">Inicio de Sesión</h2>

                <div id="alertError" class="alert-compact error" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> Credenciales incorrectas
                </div>

                <div id="alertDisabled" class="alert-compact error" style="display: none; background:#fff8e1; border-color:#ffbb33; color:#856404;">
                    <i class="fas fa-user-slash"></i> Cuenta inactiva.
                </div>

                <div th:if="${param.logout}" class="alert-compact success">
                    <i class="fas fa-check"></i> Sesión cerrada correctamente
                </div>

                <input type="text" name="username" placeholder="Usuario" required />
                <input type="password" name="password" placeholder="Contraseña" required />

                <a href="#" id="forgotPassLink" class="forgot-link" onclick="openResetModal(event)">¿Olvidaste tu contraseña?</a>

                <button type="submit" id="btnLogin">Ingresar al Sistema</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="resetModal">
        <div class="modal-card">
             <button class="btn-close-modal" id="closeModal"><i class="fas fa-times"></i></button>
            <div class="modal-icon"><i class="fas fa-lock-open"></i></div>
            <h2 class="title">Recuperar Acceso</h2>

            <div id="modalSuccess" class="alert-compact success" style="display:none;">
                <i class="fas fa-check-circle"></i> ¡Contraseña actualizada!
            </div>
            <div id="modalError" class="alert-compact error" style="display:none;">
                <i class="fas fa-times-circle"></i> Los datos no coinciden
            </div>

            <form id="formReset" style="padding: 0; margin-top: 20px;">
                <div class="input-group">
                    <i class="far fa-envelope"></i>
                    <input type="email" name="email" placeholder="Correo Electrónico" required />
                </div>
                <div class="input-group">
                    <i class="far fa-calendar-alt"></i>
                    <input type="date" name="fechaNacimiento" required title="Fecha de Nacimiento" />
                </div>
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="password" name="newPassword" placeholder="Nueva Contraseña" required />
                </div>
                
                <button type="submit" class="btn-modal" id="btnReset">Restablecer</button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/login.js}"></script> 
    
</body>
</html>
