<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - RaidSoft</title>
    
    <link rel="stylesheet" th:href="@{/css/Admin.css}">
    <link rel="stylesheet" th:href="@{/css/Perfil.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="admin-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3>RaidSoft Admin</h3>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a th:href="${usuario.rol.name() == 'ADMINISTRADOR' ? '/admin/dashboard' : '/vendedor/dashboard'}">
                        <i class="fas fa-home"></i> Inicio
                    </a>
                </li>
                
                <th:block th:if="${usuario.rol.name() == 'ADMINISTRADOR'}">
                    <li><a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> Gestionar Usuarios</a></li>
                    <li><a th:href="@{/admin/productos}"><i class="fas fa-box"></i> Productos</a></li>
                    <li><a th:href="@{/admin/stock}"><i class="fas fa-clipboard-list"></i> Stock</a></li>
                    <li>
                        <a href="#" onclick="Swal.fire('En desarrollo', 'Próximamente', 'info'); return false;">
                            <i class="fas fa-chart-line"></i> Reportes
                        </a>
                    </li>
                </th:block>

                <li><a th:href="@{/perfil}" class="active"><i class="fas fa-user-circle"></i> Mi Perfil</a></li>
                
                <li class="logout-item">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
                    </form>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header>
                <div class="user-welcome">
                    <h1>Mi Perfil</h1>
                    <p class="text-muted">Información personal y de cuenta</p>
                </div>
            </header>
            
            <div th:if="${success}" class="alert-data" th:data-msg="${success}" th:data-type="success"></div>
            <div th:if="${error}" class="alert-data" th:data-msg="${error}" th:data-type="error"></div>

            <div class="profile-container">
                
                <a th:href="@{/perfil/editar}" class="btn-edit" title="Editar Perfil">
                    <i class="fas fa-pen"></i>
                </a>

                <div class="profile-header">
                    <img th:if="${perfil != null and perfil.avatarUrl != null}" 
                         th:src="@{${perfil.avatarUrl}}" class="profile-avatar">
                         
                    <img th:if="${perfil == null or perfil.avatarUrl == null}" 
                         th:src="|https://ui-avatars.com/api/?background=4e73df&color=fff&size=150&font-size=0.5&name=${perfil != null ? perfil.nombre + '+' + perfil.apellido : usuario.username}|" 
                         class="profile-avatar" alt="Avatar Generado">

                    <h2 class="profile-name" 
                        th:text="${perfil != null ? (perfil.nombre + ' ' + perfil.apellido) : usuario.username}">
                        Nombre Usuario
                    </h2>
                    
                    <span class="profile-role" 
                          th:classappend="${usuario.rol.name() == 'VENDEDOR' ? 'role-vendedor' : ''}"
                          th:text="${usuario.rol}">
                        ROL
                    </span>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-user"></i> Usuario</span>
                        <span class="info-value" th:text="${'@' + usuario.username}">@user</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
                        <span class="info-value" th:text="${perfil != null ? perfil.email : 'No registrado'}">email@example.com</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-calendar"></i> Fecha Nacimiento</span>
                        <span class="info-value" 
                              th:text="${perfil != null and perfil.fechaNacimiento != null ? #temporals.format(perfil.fechaNacimiento, 'dd/MM/yyyy') : 'No definida'}">
                            01/01/2000
                        </span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"><i class="fas fa-clock"></i> Miembro Desde</span>
                        <span class="info-value" th:text="${#temporals.format(usuario.createdAt, 'dd/MM/yyyy')}">01/01/2025</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert-data');
            alerts.forEach(alert => {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: alert.getAttribute('data-type'),
                    title: alert.getAttribute('data-msg'),
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });
            });
        });
    </script>
</body>
</html>
