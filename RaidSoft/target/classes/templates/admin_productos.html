<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos - RaidSoft</title>

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" th:href="@{/css/Admin.css}">
    <link rel="stylesheet" th:href="@{/css/Productos.css}">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SWEETALERT -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- ✅ ESTILOS ESPECÍFICOS PARA SWEETALERT (SE MANTIENEN AQUÍ) -->
    <style>
        .swal-gamer-popup {
            background: linear-gradient(135deg, #1a1a2e, #16213e) !important;
            border: 2px solid #00ffff !important;
            color: #e0f2f7 !important;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7) !important;
        }
        .swal-title {
            color: #00ffff !important;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7) !important;
        }
        .swal-html-container {
            color: #a0ffff !important;
        }
        .swal-confirm-button-gamer {
            background: linear-gradient(90deg, #1eff80, #00e676) !important;
            color: #1a1a2e !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: bold !important;
            padding: 10px 20px !important;
            margin: 5px !important;
            box-shadow: 0 5px 15px rgba(30, 255, 128, 0.4) !important;
        }
        .swal-cancel-button-gamer {
            background: linear-gradient(90deg, #ff3366, #c44036) !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: bold !important;
            padding: 10px 20px !important;
            margin: 5px !important;
        }
    </style>

</head>
<body>
    <div class="admin-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3>RaidSoft Admin</h3>
            </div>
            <ul class="sidebar-menu">
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> Usuarios</a></li>
                <li><a th:href="@{/admin/productos}" class="active"><i class="fas fa-box"></i> Productos</a></li>
                <li><a th:href="@{/admin/stock}"><i class="fas fa-clipboard-list"></i> Stock</a></li>
                <li>
                    <a href="#" onclick="Swal.fire('En desarrollo', 'El módulo de reportes estará disponible pronto.', 'info'); return false;">
                        <i class="fas fa-chart-line"></i> Reportes
                    </a>
                </li>
                <li><a th:href="@{/perfil}"><i class="fas fa-user-circle"></i> Mi Perfil</a></li>
                <li class="logout-item">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
                    </form>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header>
                <div class="user-welcome">
                    <h1>Gestión de Inventario</h1>
                    <p class="text-muted">Administra el catálogo de productos</p>
                </div>
            </header>

            <div class="header-actions">
                <h2 style="color: #5a5c69;">Lista de Productos</h2>
                <a th:href="@{/admin/productos/nuevo}" class="btn-new"><i class="fas fa-plus"></i> Nuevo Producto</a>
            </div>

            <div class="table-container">
                <table class="product-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th> <th>Nombre</th>
                            <th>Precio Venta</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prod : ${listaProductos}">
                            <td th:text="${prod.idProducto}">#1</td>

                            <td>
                                <img th:if="${prod.imagenUrl != null && !prod.imagenUrl.isEmpty()}" 
                                     th:src="@{${prod.imagenUrl}}" 
                                     alt="Producto" 
                                     class="product-thumb">

                                <div th:unless="${prod.imagenUrl != null && !prod.imagenUrl.isEmpty()}" 
                                     class="no-img-placeholder">
                                    <i class="fas fa-image"></i>
                                </div>
                            </td>

                            <td>
                                <div style="font-weight: bold;" th:text="${prod.nombre}">Laptop HP</div>
                                <small th:text="${prod.codigoBarras}" style="color: #a0ffff;">CODE123</small>
                            </td>

                            <td th:text="'$' + ${prod.precioVenta}" style="color: #1eff80;">$0.00</td>
                            <td>
                                <span th:class="${prod.stock <= prod.stockMinimo ? 'badge-low' : 'badge-stock'}"
                                      th:text="${prod.stock}">
                                    10
                                </span>
                            </td>
                            <td>
                                <span th:if="${prod.estado}" style="color: #00e676;"><i class="fas fa-check-circle"></i> Activo</span>
                                <span th:unless="${prod.estado}" style="color: #ff3366;"><i class="fas fa-times-circle"></i> Inactivo</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/productos/editar/{id}(id=${prod.idProducto})}" class="btn-action btn-edit">
                                    <i class="fas fa-pen"></i>
                                </a>

                                <a href="javascript:void(0);"
                                   th:onclick="|confirmDelete(${prod.idProducto})|"
                                   class="btn-action btn-delete">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- SWEETALERT JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CONFIRMACIÓN ELIMINACIÓN -->
    <script th:inline="javascript">
        const deleteUrlTemplate = /*[[@{/admin/productos/eliminar/}]]*/ '/admin/productos/eliminar/';

        function confirmDelete(id) {
            Swal.fire({
                title: "¿Estás seguro?",
                text: "¡No podrás revertir esto!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí, ¡elimínalo!",
                cancelButtonText: "Cancelar",
                customClass: {
                    popup: 'swal-gamer-popup',
                    confirmButton: 'swal-confirm-button-gamer',
                    cancelButton: 'swal-cancel-button-gamer'
                },
                buttonsStyling: false
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = deleteUrlTemplate + id;
                }
            });
        }

        const successMessage = /*[[${success}]]*/ null;
        if (successMessage) {
            Swal.fire({
                title: "¡Operación Exitosa!",
                text: successMessage,
                icon: "success",
                customClass: {
                    popup: 'swal-gamer-popup',
                    confirmButton: 'swal-confirm-button-gamer'
                },
                buttonsStyling: false
            });
        }
    </script>
</body>
</html>
