<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Vendedor - RaidSoft</title>
    <link rel="stylesheet" th:href="@{/css/Vendedor.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .btn-profile {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            margin-right: 15px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .btn-profile:hover {
            background-color: #f0f2f5;
            color: #4e73df;
        }
    </style>
</head>
<body>
    <div class="vendedor-container">
        <nav class="top-nav">
            <div class="nav-brand">
                <i class="fas fa-shopping-bag"></i> RaidSoft Vendedor
            </div>
            <div class="nav-user">
                <span class="user-welcome">Hola, <strong th:text="${#authentication.name}">Vendedor</strong></span>
                
                <a th:href="@{/perfil}" class="btn-profile" title="Ver mi perfil">
                    <i class="fas fa-user-circle"></i> Mi Perfil
                </a>

                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="logout-link">
                        <i class="fas fa-sign-out-alt"></i> Salir
                    </button>
                </form>
            </div>
        </nav>

        <main class="content">
            <div class="welcome-section">
                <h2>Panel de Ventas</h2>
                <p>Selecciona una acción para comenzar</p>
            </div>
            
            <div class="actions-grid">
                <a th:href="@{/vendedor/productos}" class="action-card">
                    <div class="icon-wrapper sale">
                        <i class="fas fa-cash-register"></i>
                    </div>
                    <h3>Nueva Venta</h3>
                    <p>Registrar una salida de productos</p>
                </a>

                <a th:href="@{/vendedor/stock}" class="action-card">
                    <div class="icon-wrapper stock">
                        <i class="fas fa-boxes"></i>
                    </div>
                    <h3>Consultar Stock</h3>
                    <p>Verificar disponibilidad de inventario</p>
                </a>

                <a th:href="@{/vendedor/ventas}" class="action-card">
                    <div class="icon-wrapper history">
                        <i class="fas fa-history"></i>
                    </div>
                    <h3>Mis Ventas</h3>
                    <p>Revisar transacciones realizadas</p>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
