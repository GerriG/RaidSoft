<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Perfil - RaidSoft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Perfil.css}">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="profile-glass-card">
                    
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark"><i class="fas fa-user-edit text-primary"></i> Editar Información</h3>
                        <p class="text-muted">Actualiza tus datos personales y seguridad.</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger rounded-pill text-center">
                        <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${error}">Error</span>
                    </div>

                    <form th:action="@{/perfil/guardar}" method="post" enctype="multipart/form-data" th:object="${usuario}">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control rounded-pill px-3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary">Apellido</label>
                                <input type="text" th:field="*{apellido}" class="form-control rounded-pill px-3" required>
                            </div>

                            <div class="col-12">
                                <hr class="my-4 opacity-25">
                            </div>

                            <div class="col-md-6">
                                <h5 class="text-primary mb-3"><i class="fas fa-camera"></i> Foto de Perfil</h5>
                                
                                <div class="img-preview-box" th:if="${usuario.imagenUrl != null}">
                                    <img th:src="@{${usuario.imagenUrl}}" class="rounded-circle me-3" width="40" height="40" style="object-fit:cover;">
                                    <small class="text-success fw-bold">Imagen actual cargada</small>
                                </div>

                                <input type="file" name="file" class="form-control" accept="image/*">
                                <div class="form-text">Formatos permitidos: JPG, PNG.</div>
                            </div>

                            <div class="col-md-6">
                                <h5 class="text-primary mb-3"><i class="fas fa-key"></i> Seguridad</h5>
                                <label class="form-label fw-bold text-secondary">Nueva Contraseña</label>
                                <input type="password" name="newPassword" class="form-control rounded-pill px-3" placeholder="Déjalo vacío para no cambiar">
                                <div class="form-text text-danger"><i class="fas fa-info-circle"></i> Solo llena esto si quieres cambiar tu clave.</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-5">
                            <a th:href="@{/perfil}" class="btn btn-light rounded-pill px-4 fw-bold border">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-theme px-5">
                                Guardar Cambios <i class="fas fa-save ms-2"></i>
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
