<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Stock - RaidSoft</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f4f5f7;
                margin: 0;
                padding: 0;
            }
            .container {
                width: 90%;
                margin: 30px auto;
                background: white;
                padding: 25px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
            h2 {
                margin-bottom: 15px;
                color: #333;
            }
            .search-bar {
                margin-bottom: 20px;
            }
            .search-input {
                width: 300px;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #ccc;
            }
            .btn-search {
                padding: 10px 15px;
                background: #4e73df;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
            }
            table th, table td {
                padding: 12px;
                border-bottom: 1px solid #ddd;
                text-align: left;
            }
            table th {
                background: #4e73df;
                color: white;
            }
            .estado {
                padding: 6px 10px;
                border-radius: 6px;
                font-weight: bold;
            }
            .disponible {
                background: #c8f7c5;
                color: #2a7a2a;
            }
            .poco {
                background: #ffe7a3;
                color: #9f7700;
            }
            .agotado {
                background: #ffb3b3;
                color: #8a0000;
            }
            a.back {
                text-decoration: none;
                color: #4e73df;
                font-weight: bold;
                margin-bottom: 20px;
                display: inline-block;
            }
        </style>
    </head>

    <body>

        <div class="container">

            <a href="/vendedor/dashboard" class="back"><i class="fa fa-arrow-left"></i> Regresar</a>

            <h2>Inventario - Stock</h2>

            <form th:action="@{/vendedor/stock/search}" method="get" class="search-bar">
                <input type="text" name="query" class="search-input" placeholder="Buscar producto..."
                       th:value="${query}">
                <button class="btn-search">
                    <i class="fa fa-search"></i>
                    Buscar
                </button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Código de Barras</th>
                        <th>Stock</th>
                        <th>Stock Mínimo</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="p : ${productos}">
                        <td th:text="${p.nombre}">Nombre</td>
                        <td th:text="${p.codigoBarras}">codigo</td>
                        <td th:text="${p.stock}">10</td>
                        <td th:text="${p.stockMinimo}">3</td>

                        <td>
                            <span class="estado"
                                  th:classappend="${p.estadoStock.equals('Disponible')} ? ' disponible' :
                                  (${p.estadoStock.equals('Poco Stock')} ? ' poco' : ' agotado')"
                                  th:text="${p.estadoStock}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </body>
</html>
