<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Stock - RaidSoft</title>

    <link rel="stylesheet" th:href="@{/css/Vendedor.css}">
    <link rel="stylesheet" th:href="@{/css/Admin.css}">
    <link rel="stylesheet" th:href="@{/css/Ventas.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body style="background-color: #f0f2f5;">

    <nav class="top-nav">
        <div class="nav-brand">
            <i class="fas fa-shopping-bag"></i> 
            <span>RaidSoft Stock</span>
        </div>
        
        <div class="nav-user">
            <span class="user-welcome">Hola, <strong th:text="${#authentication.name}">Usuario</strong></span>
            
            <a th:href="@{/vendedor/dashboard}" class="btn-nav" style="background: #eef2ff; color: var(--primary);">
                <i class="fas fa-arrow-left"></i> Volver
            </a>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
            </form>
        </div>
    </nav>

    <main class="content">
        
        <div class="welcome-section" style="margin-bottom: 30px; text-align: center;">
            <h2 style="color: var(--dark); font-size: 28px; margin-bottom: 10px;">Consulta de Inventario</h2>
            <p style="color: var(--secondary); font-size: 15px;">Verifica existencias y precios rápidamente.</p>
        </div>

        <div class="search-container-hero">
            <form th:action="@{/vendedor/stock/search}" method="get" class="search-box-hero" style="max-width: 700px;">
                <i class="fas fa-search"></i>
                
                <input type="text" name="query" 
                       placeholder="Escribe nombre, código o descripción..." 
                       th:value="${query}" 
                       autocomplete="off">
            </form>

            <div th:if="${query != null}" style="margin-top: 15px;">
                <a th:href="@{/vendedor/stock}" style="color: var(--danger); font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; gap: 5px;">
                    <i class="fas fa-times-circle"></i> Limpiar filtro
                </a>
            </div>
        </div>

        <div class="table-card">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Imagen</th> 
                        <th>Producto</th>
                        <th>Cód. Barras</th>
                        <th class="text-center">Stock</th>
                        <th class="text-center">Estado</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="p : ${productos}">

                        <td>
                            <img th:if="${p.imagenUrl != null}" th:src="@{${p.imagenUrl}}" class="product-thumb" alt="Img">
                            <div th:if="${p.imagenUrl == null}" class="no-img-placeholder"><i class="fas fa-image"></i></div>
                        </td>

                        <td>
                            <div style="font-weight: 600; color: var(--dark); font-size: 15px;" th:text="${p.nombre}">Nombre</div>
                            <div style="color: var(--primary); font-weight: 700; font-size: 14px;">
                                $ <span th:text="${p.precioVenta}">0.00</span>
                            </div>
                        </td>

                        <td th:text="${p.codigoBarras}" style="font-family: monospace; color: var(--secondary); font-size: 13px;">CODE</td>
                        
                        <td style="text-align: center;">
                            <span style="font-size: 18px; font-weight: 800;" 
                                  th:styleappend="${p.stock <= p.stockMinimo ? 'color: var(--danger);' : 'color: var(--dark);'}"
                                  th:text="${p.stock}">
                                10
                            </span>
                        </td>

                        <td style="text-align: center;">
                            <span th:unless="${p.estado}" class="badge badge-secondary">
                                <i class="fas fa-ban"></i> Inactivo
                            </span>

                            <th:block th:if="${p.estado}">
                                <span th:if="${p.estadoStock == 'Disponible'}" class="badge badge-success">Disponible</span>
                                <span th:if="${p.estadoStock == 'Poco Stock'}" class="badge badge-warning">Poco Stock</span>
                                <span th:if="${p.estadoStock == 'Agotado'}" class="badge badge-danger">Agotado</span>
                            </th:block>
                        </td>
                    </tr>
                    
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="5" style="text-align: center; padding: 50px; color: var(--secondary);">
                            <i class="fas fa-search fa-3x mb-3" style="opacity: 0.2;"></i><br>
                            No se encontraron productos.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
</body>
</html>
